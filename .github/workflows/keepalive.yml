name: Keep Render awake 24/7

on:
  schedule:
    # Two overlapping long-running keepers: each run pings for ~5h45m.
    - cron: '0 */6 * * *'
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping MiniStudio every 4 minutes
        run: |
          echo "Keepalive started at $(date -u)"
          for i in $(seq 1 86); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://autoai-logokino.onrender.com/api/health || true)
            echo "[$i/86] $(date -u +%H:%M:%S) health=$code"
            sleep 240
          done
          echo "Keepalive finished at $(date -u)"
