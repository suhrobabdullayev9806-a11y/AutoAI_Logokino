name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MiniStudio health endpoint
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 30 https://autoai-logokino.onrender.com/api/health && exit 0
            sleep 20
          done
          exit 0
